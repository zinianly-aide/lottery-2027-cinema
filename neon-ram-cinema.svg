<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 610" role="img" aria-label="2027 星河璀璨 · 正面银河霓虹羊首">
 <defs>
  <linearGradient id="horn" x1="0" x2="1" y1="0" y2="1">
   <stop stop-color="#8de9ff"/><stop offset=".22" stop-color="#6c59ff"/><stop offset=".52" stop-color="#a16cff"/><stop offset=".76" stop-color="#fff6cd"/><stop offset="1" stop-color="#9d83e8"/>
  </linearGradient>
  <linearGradient id="hornRight" x1="0" x2="1" y1="1" y2="0">
   <stop stop-color="#a4c5ff"/><stop offset=".35" stop-color="#ff639f"/><stop offset=".7" stop-color="#965bff"/><stop offset="1" stop-color="#8cecff"/>
  </linearGradient>
  <linearGradient id="face" x1="0" x2="1" y1="0" y2="1">
   <stop stop-color="#8feaff"/><stop offset=".28" stop-color="#303d9c"/><stop offset=".56" stop-color="#6a37c9"/><stop offset=".83" stop-color="#875be8"/><stop offset="1" stop-color="#ffdbbf"/>
  </linearGradient>
  <linearGradient id="ribbon" x1="0" x2="1">
   <stop stop-color="#009cff" stop-opacity="0"/><stop offset=".2" stop-color="#2087ff" stop-opacity=".9"/><stop offset=".5" stop-color="#ff7fe1" stop-opacity=".93"/><stop offset=".8" stop-color="#3afaff" stop-opacity=".75"/><stop offset="1" stop-color="#3ad6ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo"><stop stop-color="#6e93ff" stop-opacity=".55"/><stop offset=".4" stop-color="#7144dc" stop-opacity=".18"/><stop offset="1" stop-color="#0d0935" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="neon" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="streaks" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M4 0L11 50 M26 0L34 50" stroke="#d5ecff" opacity=".13" stroke-width="1"/></pattern>
 </defs>
 <ellipse cx="800" cy="265" rx="475" ry="275" fill="url(#halo)"/>
 <!-- wide cinematic ribbons -->
 <path d="M-90 240 C195 500 290 82 505 185 S745 545 810 330 S1230 80 1680 230" fill="none" stroke="url(#ribbon)" stroke-width="63" stroke-opacity=".2" filter="url(#blur)"/>
 <path d="M-90 237 C195 500 290 82 505 185 S745 545 810 330 S1230 80 1680 230" fill="none" stroke="url(#ribbon)" stroke-width="19" stroke-opacity=".42"/>
 <path d="M-90 238 C195 498 290 84 505 186 S745 544 810 330 S1230 82 1680 231" fill="none" stroke="url(#ribbon)" stroke-width="3.5" filter="url(#neon)">

 </path>
 <path d="M30 385 C410 180 485 530 760 315 S1260 465 1580 280" fill="none" stroke="url(#ribbon)" stroke-width="12" opacity=".6" filter="url(#neon)"/>
