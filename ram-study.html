<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>粒子羊首 · 1200 张照片</title><style>body{margin:0;background:#03091b;overflow:hidden}canvas{display:block}nav{position:fixed;bottom:16px;left:20px;color:white;font:14px system-ui}button{background:#122444;color:#fff;border:1px solid #457da9;border-radius:8px;padding:8px 14px;margin:4px}</style></head><body><div id="screen"></div><nav>照片粒子 <button data-n="800">800</button><button data-n="1200">1200</button><button data-n="1600">1600</button><a href="./?mode=ramdepth&amp;quality=medium" style="display:inline-block;color:#d9f4ff;background:#0a4262;border:1px solid #4fd6ff;border-radius:8px;padding:8px 14px;margin:4px;text-decoration:none">✧ 纯深度粒子</a> <button id="full">全屏</button></nav><script type="module">
import {createRamBloom} from './ram-bloom.js';
import * as T from './vendor/three.module.js';import {createRamReference} from './ram-reference.js?v=unified2';
const scene=new T.Scene();scene.background=new T.Color('#03091b');const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);camera.position.set(0,0,66);camera.lookAt(0,0,0);
const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);document.querySelector('#screen').append(renderer.domElement);
const ram=createRamReference(T,scene,{quality:'high'});ram.setVisible(true);const n=Number(new URLSearchParams(location.search).get('photos')||1200);ram.photos.setRatio(n/2000);
window.ramQA={scene,camera,renderer,ramReference:ram};window.__cinemaReady=true;window.ramPhotoStats={visible:n};
const bloom=createRamBloom(T,renderer,scene,camera);
function draw(t){ram.update(t/1000,1);bloom.render();requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ram.photos.setRatio(Number(b.dataset.n)/2000);window.ramPhotoStats.visible=ram.photos.count});document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen();
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
